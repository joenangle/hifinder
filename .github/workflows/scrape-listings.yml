name: Scrape Used Market Listings

on:
  schedule:
    # Run every 4 hours (6 times daily: 12am, 4am, 8am, 12pm, 4pm, 8pm EST/EDT)
    - cron: '0 5,9,13,17,21,1 * * *'  # UTC times for EST/EDT
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape-reddit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Reddit r/AVexchange
        timeout-minutes: 30
        run: npm run scrape:reddit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Log completion
        run: |
          echo "✅ Reddit scraping completed at $(date)"
          echo "🔍 Check Supabase used_listings table for new entries"
          echo "🚀 Workflow triggered successfully"

      # Match the freshly-scraped listings against active price alerts so the
      # daily send-notifications cron has a non-empty queue to drain. Idempotent
      # (de-dups on alert_id + listing_url), so safe to re-run on every scrape.
      - name: Trigger price-alert matching
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE_URL="${SITE_URL:-https://hifinder.app}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping alert matching (alerts will not fire until configured)"
            exit 0
          fi
          echo "🔔 Triggering alert matching at $BASE_URL/api/alerts/match-new"
          STATUS=$(curl -sS -o /tmp/match.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/alerts/match-new")
          echo "HTTP $STATUS"
          cat /tmp/match.json || true
          if [ "$STATUS" != "200" ]; then
            echo "::error::Alert matching returned HTTP $STATUS"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure